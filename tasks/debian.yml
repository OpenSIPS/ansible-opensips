---
# tasks for opensips installing OpenSIPS on Debian
- name: Setup OpenSIPS prerequisites
  apt:
    name: gpg
    state: present
  register: apt_prereq_result
  until: apt_prereq_result is success
  retries: 10
  delay: 2

- name: Setup OpenSIPS key and repository (Debian)
  block:
    - name: Download OpenSIPS repository key
      ansible.builtin.get_url:
        url: '{{ opensips_apt_key_url }}'
        dest: '{{ opensips_apt_key_dest }}'
        mode: '0644'

    - name: Setup OpenSIPS repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by={{ opensips_apt_key_dest }}]
          {{ opensips_apt_repo }}
          {{ ansible_distribution_release }}
          {{ opensips_version }}-releases
        state: present

- name: Install OpenSIPS (Debian)
  apt:
    name: opensips
    state: present
  notify:
    - opensips enable
    - opensips restart
  register: apt_install_result
  until: apt_install_result is success
  retries: 10
  delay: 2

- name: Install OpenSIPS additional modules (Debian)
  apt:
    name: '{{ opensips_modules }}'
    state: present
  when: opensips_modules is defined and opensips_modules | length
  notify:
    - opensips enable
    - opensips restart
  register: apt_modules_install_result
  until: apt_modules_install_result is success
  retries: 10
  delay: 2
